<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vernier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ═══════════ TOP-LEFT CONTROLS ═══════════ -->
    <div class="top-controls">

        <!-- Brand + hidden pill -->
        <div class="brand-wrap">
            <button class="brand-icon" id="brand-btn" aria-label="Home">
                <svg viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.5 18.2c0-4.9 4-8.9 8.9-8.9h.6c2.1 0 4 .7 5.5 1.9L23.5 8v6.4c.4.7.7 1.6.7 2.5 0 4.4-3.6 8-8 8h-5.7c-4.4 0-8-3-8-6.7z"/>
                    <circle cx="9.2" cy="15.2" r="1.15" fill="#1a1a1a"/>
                </svg>
            </button>
            <div class="pill">
                <button class="pill-btn" id="menu-btn" aria-label="Chat history">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="16" rx="3"/>
                        <line x1="9" y1="4" x2="9" y2="20"/>
                    </svg>
                </button>
                <button class="pill-btn" id="search-btn" aria-label="Search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
                    </svg>
                </button>
                <button class="pill-btn" id="new-chat-btn" aria-label="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"/>
                        <line x1="5" y1="12" x2="19" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- ─── MODEL SELECTOR ─── -->
        <div class="model-selector" id="model-selector" data-model="standard">
            <button class="model-trigger" id="model-trigger" type="button" aria-haspopup="listbox" aria-expanded="false">
                <span class="model-dot"></span>
                <span class="model-name" id="model-name">Standard</span>
                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </button>

            <div class="model-dropdown" id="model-dropdown" role="listbox">
                <div class="model-dropdown-label">Select model</div>

                <button class="model-option active" data-model="standard" role="option" aria-selected="true">
                    <div class="model-opt-icon">🎨</div>
                    <div class="model-opt-info">
                        <div class="model-opt-name">Standard</div>
                        <div class="model-opt-desc">Safe, family-friendly images</div>
                    </div>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>

                <button class="model-option" data-model="uncensored" role="option" aria-selected="false">
                    <div class="model-opt-icon">🔓</div>
                    <div class="model-opt-info">
                        <div class="model-opt-name">Uncensored</div>
                        <div class="model-opt-desc">No content restrictions</div>
                    </div>
                    <svg class="check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- ═══════════ MAIN ═══════════ -->
    <div class="main empty" id="main">

        <!-- Greeting -->
        <div class="greeting" id="greeting">
            <svg class="greeting-icon" viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path d="M2.5 18.2c0-4.9 4-8.9 8.9-8.9h.6c2.1 0 4 .7 5.5 1.9L23.5 8v6.4c.4.7.7 1.6.7 2.5 0 4.4-3.6 8-8 8h-5.7c-4.4 0-8-3-8-6.7z"/>
                <circle cx="9.2" cy="15.2" r="1.15" fill="#1a1a1a"/>
            </svg>
            <h1>Hi! What's on your mind today?</h1>
        </div>

        <!-- Messages -->
        <div class="messages" id="messages"></div>

        <!-- Input -->
        <div class="input-area">
            <div class="input-box" id="input-box">
                <textarea
                    id="prompt"
                    placeholder="Describe an image to generate..."
                    rows="1"
                    autocomplete="off"
                    spellcheck="false"
                ></textarea>

                <div class="input-footer">
                    <div class="input-left">
                        <button class="toggle-btn" id="settings-btn" type="button">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="3"/>
                                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                            </svg>
                            <span>Settings</span>
                        </button>
                        <button class="toggle-btn" id="enhance-btn" type="button" style="display: none;">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3l1.6 4.9L18.5 9.5l-4.9 1.6L12 16l-1.6-4.9L5.5 9.5l4.9-1.6z"/>
                                <path d="M18.5 15l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/>
                            </svg>
                            <span>Enhance</span>
                        </button>
                    </div>
                    <div class="input-right">
                        <span class="char-count" id="char-count">0</span>
                        <button class="send-btn" id="send-btn" aria-label="Send" type="button" disabled>
                            <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="19" x2="12" y2="6"/>
                                <polyline points="6 12 12 6 18 12"/>
                            </svg>
                            <span class="send-spinner"></span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="error-toast" id="error-toast"></div>
            <div class="footer-hint">Vernier can make mistakes. Please verify important info.</div>
        </div>
    </div>

    <!-- ═══════════ CHAT HISTORY SIDEBAR ═══════════ -->
    <aside class="sidebar" id="sidebar" aria-hidden="true">
        <div class="sidebar-header">
            <div class="sidebar-brand">
                <svg viewBox="0 0 32 32" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.5 18.2c0-4.9 4-8.9 8.9-8.9h.6c2.1 0 4 .7 5.5 1.9L23.5 8v6.4c.4.7.7 1.6.7 2.5 0 4.4-3.6 8-8 8h-5.7c-4.4 0-8-3-8-6.7z"/>
                    <circle cx="9.2" cy="15.2" r="1.15" fill="#1a1a1a"/>
                </svg>
                <span>Chats</span>
            </div>
            <button class="close-btn" id="close-sidebar" aria-label="Close">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"/>
                    <line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>

        <div class="sidebar-toolbar">
            <button class="new-chat-side" id="new-chat-side">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"/>
                    <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                <span>New chat</span>
            </button>
        </div>

        <div class="sidebar-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="16.5" y1="16.5" x2="21" y2="21"/>
            </svg>
            <input type="text" id="history-search" placeholder="Search chats...">
        </div>

        <div class="sidebar-body" id="history-list">
            <!-- Chats rendered by JS -->
        </div>

        <div class="sidebar-footer">
            <button class="ghost-btn" id="clear-all">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/>
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                </svg>
                <span>Clear all chats</span>
            </button>
        </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- ═══════════ SETTINGS MODAL ═══════════ -->
    <div class="modal-overlay" id="settings-modal" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <div class="modal-header">
                <h2 id="settings-title">Generation Settings</h2>
                <button class="close-btn" id="close-settings" aria-label="Close">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"/>
                        <line x1="6" y1="6" x2="18" y2="18"/>
                    </svg>
                </button>
            </div>

            <div class="modal-body">

                <!-- ★ AI ENGINE (dynamic by main model) -->
                <div class="field-group">
                    <label for="engine">
                        AI Engine
                        <span class="val" id="engine-badge">3 available</span>
                    </label>
                    <select id="engine">
                        <!-- Options populated by JS -->
                    </select>
                    <div class="field-hint" id="engine-hint"></div>
                </div>

                <div class="field-group">
                    <label for="negative">Negative prompt</label>
                    <input type="text" id="negative" placeholder="What to avoid...">
                </div>

                <div class="field-group">
                    <label for="ratio">Aspect ratio</label>
                    <select id="ratio">
                        <option value="16:9 Landscape (1216x832)" selected>16:9 Landscape</option>
                        <option value="1:1 Square (1024x1024)">1:1 Square</option>
                        <option value="9:16 Portrait (832x1216)">9:16 Portrait</option>
                    </select>
                </div>

                <div class="field-group">
                    <label>Steps <span class="val" id="steps-value">28</span></label>
                    <input type="range" id="steps" min="20" max="35" value="28" step="1">
                </div>

                <div class="field-group">
                    <label>CFG scale <span class="val" id="cfg-value">6.5</span></label>
                    <input type="range" id="cfg" min="4" max="9" value="6.5" step="0.5">
                </div>

                <div class="field-group">
                    <label for="seed">Seed <span class="val">-1 = random</span></label>
                    <input type="number" id="seed" value="-1" step="1">
                </div>
            </div>

            <div class="modal-footer">
                <button class="primary-btn" id="save-settings">Done</button>
            </div>
        </div>
    </div>

    <script src="script.js" type="module"></script>
</body>
</html>
